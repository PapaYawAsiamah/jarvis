# Jarvis configuration. API keys are NEVER stored here — use environment variables:
#   OPENAI_API_KEY   (for brain.provider: openai)
#   GEMINI_API_KEY   (for brain.provider: gemini)

brain:
  provider: openai              # openai | gemini
  openai_model: gpt-6-luna      # low-cost model with function calling
  gemini_model: gemini-3.5-flash-lite
  temperature: 0.4             # Gemini only (current OpenAI models reject it)
  max_tool_rounds: 5            # max tool-call round trips per request
  request_timeout_s: 20
  memory_turns: 10              # conversation turns kept
  memory_reset_idle_s: 300      # forget conversation after 5 minutes idle

assistant:
  user_name: ""                 # optional, e.g. "Kofi" — Jarvis may use it
  music_app: spotify            # what "I feel like listening to music" opens
  address: sir                  # how Jarvis addresses you
  wake_reply: "Yes, sir?"       # spoken when you say "Jarvis" and pause ("" = soft chime instead)

conversation:
  follow_up_window_s: 5         # after a reply, keep listening this long without the wake word (0 = off)
  question_wait_s: 7            # how long to wait for an answer when Jarvis asks a question
  barge_in: true                # say "Jarvis" while it's talking to interrupt
  wake_sound: true              # soft chime on wake if wake_reply is empty

wake_word:
  model: hey_jarvis             # openWakeWord pretrained model (also usually fires on just "Jarvis")
  threshold: 0.35               # 0..1 — lower = more sensitive; raise if it wakes by itself
  cooldown_s: 2.0               # ignore re-triggers right after a wake

audio:
  input_device: null            # null = system default; or device index / name substring
  sample_rate: 16000
  input_gain: 2.0               # software boost for quiet mics (your mic is quiet)
  silence_threshold: 0.006      # minimum RMS treated as speech (auto-raised in noisy rooms)
  silence_duration_s: 1.0       # stop recording after this much silence
  max_record_s: 10
  no_speech_timeout_s: 4.0      # give up if you say nothing at all

stt:
  model: base.en
  device: cuda                  # cuda (GTX 1070: ~0.1 s per command) | cpu (~1.3 s); falls back to cpu automatically
  compute_type: int8            # int8 works on both; don't use float16 on a GTX 10xx
  beam_size: 1

tts:
  engine: kokoro                # kokoro (natural, offline neural) | sapi (Windows voices: robotic but instant)
  kokoro_voice: am_michael      # American male: am_michael | am_puck | am_fenrir  (others: bm_george, af_heart...)
  kokoro_speed: 1.0             # 0.8 = slower, 1.2 = faster
  kokoro_device: cuda           # cuda (fast, smooth) | cpu (gaps between sentences on this CPU); falls back to cpu
  kokoro_model_gpu: models/kokoro-v1.0.onnx
  kokoro_model: models/kokoro-v1.0.int8.onnx
  kokoro_voices: models/voices-v1.0.bin
  voice: "Zira"                 # Windows fallback voice (used only if Kokoro fails)
  rate: 185                     # Windows fallback voice, words per minute
  volume: 1.0

paths:
  # Extra folders Jarvis may touch, besides your user folder. Example: "D:/Projects"
  extra_allowed_folders: []

ui:
  position: center              # center | bottom-right | top-right
  size: 420
  margin: 40                    # distance from screen edge for corner positions
  fps: 60                       # 30 uses ~25% less CPU while the HUD is visible
  fade_in_ms: 250
  fade_out_delay_ms: 1500
  font: "Orbitron"              # labels (bundled in ui/fonts); falls back to Segoe UI
  caption_font: "Rajdhani"      # captions (bundled in ui/fonts); falls back to Segoe UI
  backdrop: 0.35                # dark glass behind the HUD so it reads on bright windows (0 = none)
  palette:
    primary: "#00E5FF"
    secondary: "#0077FF"
    highlight: "#FFFFFF"
    accent: "#FF5A36"

logging:
  file: jarvis_log.txt
